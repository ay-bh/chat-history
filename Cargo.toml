[package]
name = "chat-history"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
authors = ["Ayush Bhardwaj"]
description = "Search, inspect, and export Claude Code, Cursor, and Codex conversation history"
license = "MIT"
repository = "https://github.com/ay-bh/chat-history"
readme = "README.md"
keywords = ["claude-code", "cursor-ide", "codex", "conversation", "transcript"]
categories = ["command-line-utilities", "development-tools"]


[[bin]]
name = "chat-history"
path = "src/main.rs"

[[bin]]
name = "ch"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.31", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
glob = "0.3"
rayon = "1.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
